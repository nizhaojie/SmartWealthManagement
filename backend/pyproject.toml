[project]
name = "smart-wealth-backend"
version = "0.1.0"
description = "智能财富管家系统后端"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic-settings>=2.6.0",
    "sqlalchemy>=2.0.36",
    "alembic>=1.14.0",
    "pymysql>=1.1.1",
    "cryptography>=43.0.0",
    "argon2-cffi>=23.1.0",
    "redis>=5.2.0",
    "pymilvus>=2.4.9",
    "minio>=7.2.0",
    "neo4j>=5.26.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "httpx>=0.28.0",
    "mypy>=1.13.0",
]

[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
packages = ["app"]
ignore_missing_imports = true
strict = false
